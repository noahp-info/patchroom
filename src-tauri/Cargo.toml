[package]
name = "patchroom"
description = "Slack-style desktop app for your AI coding CLI sessions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "patchroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
patchroom-core = { path = "../crates/patchroom-core" }
patchroom-pty = { path = "../crates/patchroom-pty" }
patchroom-bridge = { path = "../crates/patchroom-bridge" }
patchroom-store = { path = "../crates/patchroom-store" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
