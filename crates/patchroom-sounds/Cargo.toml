[package]
name = "patchroom-sounds"
description = "Patchroom sound packs: the pack registry, custom sound import with limits, and read-only import of Claude sound profiles."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
patchroom-prefs = { path = "../patchroom-prefs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav", "aiff"] }
ulid = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
