[package]
name = "patchroom-claude"
description = "Patchroom Claude Code adapter: transcript tail to chat items, plus the dump corpus tool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "patchroom_claude"
path = "src/lib.rs"

[[bin]]
name = "patchroom-claude"
path = "src/bin/patchroom-claude.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
