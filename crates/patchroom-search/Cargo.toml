[package]
name = "patchroom-search"
description = "Patchroom full-text search: an SQLite FTS5 index over chat item text."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
patchroom-claude = { path = "../patchroom-claude" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"

[lints]
workspace = true
