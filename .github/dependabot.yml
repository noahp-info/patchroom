# Version-update PRs open against `dev`, never the release branch.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "deps(cargo)" }

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "deps(npm)" }

  - package-ecosystem: npm
    directory: /ui
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "deps(ui)" }

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      actions-all: { patterns: ["*"] }
    commit-message: { prefix: "ci(actions)" }
